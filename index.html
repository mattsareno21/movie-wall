<!DOCTYPE html>
<html>
  <head>
    <title>My Movie Wall</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="tab-list">
        <div class="tab" data-target="home-wall">
            <p>Home</p>
        </div>
        <div class="tab" data-target="quote-wall">
            <p>Quote Wall</p>
        </div>
        <div class="tab" data-target="poster-wall">
            <p>Poster Wall</p>
        </div>
    </div>
    <div class="wall" id="home-wall">
        <div class="add-movie">
            <input type="text" id="movie-input" placeholder="movie title...">
            <input type="text" id="quote-input" placeholder = "add a quote...">
            <input type="text" id="context-input" placeholder = "add your notes on the quote...">
            <button id="movie-btn">Add</button>
        </div>
        <div class="clear-data">
            <button id="clear-btn">Clear Data</button>
        </div>
    </div>
    <div class="wall" id="quote-wall">
        <h1>movie quotes i love ˙✧˖° ༘ ⋆｡˚</h1>
    </div>
    <div class="wall" id="poster-wall">
    </div>
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <img class="modal-poster" src="" alt="movie poster">
            <h2 class="modal-title"></h2>
            <p class="modal-details"></p>
        </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
